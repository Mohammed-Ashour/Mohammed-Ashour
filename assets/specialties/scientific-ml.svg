    <g transform="translate(-63 32)" stroke="#78d7c4"><rect width="12" height="12" fill="#21463e"/><rect x="15" width="12" height="12" fill="#2b6052"/><rect y="15" width="12" height="12" fill="#387962"/><rect x="15" y="15" width="12" height="12" fill="#21463e"/></g>
