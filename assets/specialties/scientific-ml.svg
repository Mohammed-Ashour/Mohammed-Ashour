<svg xmlns="http://www.w3.org/2000/svg" width="480" height="232" viewBox="480 232 480 232" role="img" aria-labelledby="title desc">
<title id="title">Scientific ML</title>
<desc id="desc">Satellite data pipelines with GDAL and Rasterio. Data-intensive apps with Airflow orchestration, retries and reprocessing. Cloud systems with AWS, Kubernetes and Terraform/OpenTofu. Scientific ML with tested, versioned Python libraries.</desc>
