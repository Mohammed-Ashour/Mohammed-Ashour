  <radialGradient id="earth"><stop stop-color="#203e55"/><stop offset="1" stop-color="#111e2b"/></radialGradient>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111d29"/><stop offset="1" stop-color="#0c131d"/></linearGradient>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" fill="none" stroke="#6d8caa" stroke-width="1.5"/></marker>
</defs>
<rect x=".5" y=".5" width="959" height="463" rx="16" fill="url(#bg)" stroke="#2b3b4d"/>
<path d="M480 24v416M24 232h912" stroke="#293849"/>
